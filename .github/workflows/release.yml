name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: VERSION="${GITHUB_REF_NAME#v}" ./build.sh
      - name: Package
        run: |
          cd build
          ditto -c -k --keepParent Relaycat.app "Relaycat-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Relaycat-${GITHUB_REF_NAME}.zip" > "Relaycat-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/Relaycat-*.zip build/Relaycat-*.zip.sha256 --title "Relaycat ${GITHUB_REF_NAME#v}" --generate-notes
